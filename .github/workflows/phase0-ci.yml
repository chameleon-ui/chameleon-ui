name: Phase 4 CI

on:
  schedule:
    - cron: "30 18 * * *"
  pull_request:
  push:
    branches:
      - main
      - feat/phase0-poc

permissions:
  contents: read

jobs:
  phase4:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: chameleon-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate the repository pnpm version
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version
      - name: Install from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Run the Phase 4 gate (includes ci:phase3)
        run: pnpm ci:phase4
      - name: Verify official external Vite templates (typecheck)
        run: pnpm verify:external
      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: |
            chameleon-ui/toolings/visual-regression/artifacts/**
            chameleon-ui/toolings/visual-regression/test-results/**
